<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>humaniseAI Email Signatures</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#/">
      <img class="brand-logo" src="assets/logo-humaniseai.svg" alt="humaniseAI" width="125" height="30">
      <span>Email Signatures</span>
    </a>
  </div>
</header>

<!-- ======================= LIST VIEW ======================= -->
<main class="wrap view" id="view-list" hidden>
  <h1 class="page-title">Find your name</h1>
  <p class="page-sub">Select yourself from the list to get your signature and the steps to install it.</p>

  <div class="search">
    <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M9 2a7 7 0 105.3 11.6l3.6 3.6 1.4-1.4-3.6-3.6A7 7 0 009 2zm0 2a5 5 0 110 10A5 5 0 019 4z"/></svg>
    <input id="search" type="search" placeholder="Search by name or job title" autocomplete="off" aria-label="Search employees">
  </div>

  <div id="people"></div>
  <p class="empty" id="no-results" hidden>No one matches that search.</p>
</main>

<!-- ====================== DETAIL VIEW ====================== -->
<main class="wrap view detail" id="view-detail" hidden>
  <a class="back" href="#/">&#8592; All employees</a>

  <div class="detail-head">
    <img class="detail-photo" id="detail-photo" alt="" width="56" height="56">
    <div>
      <h1 class="detail-name" id="detail-name"></h1>
      <p class="detail-title" id="detail-title"></p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>Where are you setting this up?</h2></div>
    <!-- The chosen client drives everything below it: the markup in the preview,
         the buttons, and the steps. Rendered by app.js from js/targets.js. -->
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Your signature</h2>
      <div class="actions" id="actions"></div>
    </div>

    <!-- The signature lives in its own iframe: a bare document with none of this
         page's CSS, so the clipboard fragment carries only the signature's own
         inline styles. Copying out of a styled page makes Outlook and Gmail
         override them, which is what broke the paste. -->
    <div class="preview-frame">
      <iframe class="sig-frame" id="sig-frame" title="Your email signature" scrolling="no"></iframe>
    </div>

    <p class="hint" id="hint"></p>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>How to install it</h2></div>
    <ol class="steps" id="steps"></ol>
    <p class="hint" id="note"></p>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Load order matters: data first, then the template, then the page logic.
     Plain scripts (not modules) so index.html also works when opened directly. -->
<script src="js/assets.js"></script>
<script src="js/photos.js"></script>
<script src="js/company.js"></script>
<script src="js/targets.js"></script>
<script src="js/employees.js"></script>
<script src="js/signature.js"></script>
<script src="js/zip.js"></script>
<script src="js/app.js"></script>
</body>
</html>
