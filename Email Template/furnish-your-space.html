<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML><HEAD><TITLE>Email Signature</TITLE>
<META content="text/html; charset=utf-8" http-equiv="Content-Type">
</HEAD>
<BODY style="font-size: 9pt; font-family: Arial, sans-serif;">

<table style="width: 480px; font-size: 9pt; FONT-FAMILY: Arial; background: transparent !important;" cellpadding="0" cellspacing="0" border="0">
    <tbody>
        <tr>
            <td style="width: 142px; vertical-align: top; padding-top: 0; border-right: 1px solid #008ae1" valign="top" >
                <img src="photo.png" alt="photograph" width="117" border="0" style="border:0; height:auto; width:117px"/> 
            </td>
            <td style="width: 25px;"></td>
            <td style="width: 313px;">
                <span style="font-size: 10pt; font-family: Arial black; color:#000000; font-weight: bold;">{firstName} {lastName}<br/></span>
                <span style="font-family: Arial; font-size: 9pt; line-height: 15px; color:#000000;">{title}<br/></span>
        
                <p style="padding-top: 10px; padding-bottom: 0px; margin: 0px; font-size: 9pt; line-height: 15px;">

                    <span style="font-size: 9pt; line-height: 15px; color:#000000;">
                        <strong>P:</strong> <span style="color:#000000;">{phone}</span><span style="font-size: 9pt; line-height: 15px; color:#000000;"> | </span>
                    </span>

                    <span style="font-size: 9pt; line-height: 15px; color:#000000;">
                        <strong>M:</strong> <span style="color:#000000;">{mobile}</span>
                    </span>

                    <span style="line-height: 15px; "><br/></span>
                    
                    <span style="FONT-FAMILY: Arial; font-size: 9pt; line-height: 15px; color:#000000;">
                        <strong>E:</strong> <a href="mailto:{email}" style="font-size: 9pt; color:#000000; text-decoration: none;"><span style="text-decoration: none; font-size: 9pt;  line-height: 15px; color:#000000; FONT-FAMILY: Arial;">{email}</span></a>
                        <span style="font-size: 9pt; line-height: 15px; color:#000000;"> | </span>
                    </span>

                    <span style="padding: 0px; margin-top: 10px; margin-bottom: 0px; text-align: right;" >
                        <a href="{website}" target="_blank" rel="noopener" style="FONT-FAMILY: Arial;font-size: 9pt; color: #008ae1 !important; text-decoration:none !important;"><span  style="FONT-FAMILY: Arial;font-size: 9pt; color: #008ae1 !important;  text-decoration:none !important;">{website}</span></a>
                    </span>

                    <span style="line-height: 15px; "><br/></span>

                    <span style="line-height: 15px; ">
                        <span style="font-size: 9pt; line-height: 15px; font-family: Arial; color: #000000;">{address1}<span style="font-size: 9pt; line-height: 15px;"> |</span></span>
                        <span style="font-size: 9pt; line-height: 15px; font-family: Arial; color: #000000;">{address2}</span>
                    </span>
                </p>

                <p style="padding-top: 0px; padding-bottom: 0px; margin: 0px; margin-top:10px; font-size: 9pt; line-height: 15px;">
                    <a href="https://www.facebook.com/MyCompany" target="_blank" rel="noopener"><img border="0" width="15" src="fb.png" alt="facebook icon" style="border:0; height:13px; width:13px"></a>&nbsp;&nbsp;
                    <a href="https://twitter.com/MyCompany404" target="_blank" rel="noopener"><img border="0" width="15" src="tt.png" alt="twitter icon" style="border:0; height:13px; width:13px"></a>&nbsp;&nbsp;
                    <a href="https://www.youtube.com/user/MyCompanyChannel" target="_blank" rel="noopener"><img border="0" width="15" src="yt.png" alt="youtube icon" style="border:0; height:13px; width:13px"></a>&nbsp;&nbsp;
                    <a href="https://www.linkedin.com/company/mycompany404" target="_blank" rel="noopener"><img border="0" width="15" src="ln.png" alt="linkedin icon" style="border:0; height:13px; width:13px"></a>&nbsp;&nbsp;
                    <a href="https://www.instagram.com/mycompany404/" target="_blank" rel="noopener"><img border="0" width="15" src="it.png" alt="instagram icon" style="border:0; height:13px; width:13px"></a>&nbsp;&nbsp;
                    <a href="https://pinterest.com/mycompany404/" target="_blank" rel="noopener"><img border="0" width="15" src="pt.png" alt="pinterest icon" style="border:0; height:13px; width:13px"></a>&nbsp;&nbsp;
                </p>                
            </td>
        </tr>
        <tr>
            <td colspan="3" style="padding-top: 18px;">
                <a href="https://www.codetwo.com/email-signatures/" target="_blank" rel="noopener"><img border="0" alt="Banner" width="480" style="width:480px; height:auto; border:0;" src="banner.png"></a>  
            </td>
        </tr>
    </tbody>
</table>
